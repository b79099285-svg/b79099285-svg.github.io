<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>FexingProject — OG cover source</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: #080a0d;
      color: #eef2f6;
      font-family: "Manrope", sans-serif;
    }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% center; }
    .shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(8,10,13,.97) 0%, rgba(8,10,13,.88) 38%, rgba(8,10,13,.35) 72%, rgba(8,10,13,.55) 100%),
        linear-gradient(180deg, rgba(8,10,13,.5), transparent 40%, rgba(8,10,13,.9));
    }
    .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(180deg, #000, transparent 85%);
    }
    .content { position: relative; z-index: 2; padding: 54px 64px; height: 100%; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 50px; height: 50px; border-radius: 11px; }
    .brand-name { font-family: "Unbounded", sans-serif; font-size: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .brand-name span { color: #ff9e2c; margin-left: .35em; }
    .kicker {
      margin-top: 54px; color: #ff9e2c; font-family: Consolas, monospace;
      font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
      display: flex; align-items: center; gap: 14px;
    }
    .kicker::before { content: ""; width: 34px; height: 1px; background: #ff9e2c; }
    h1 {
      margin-top: 18px; font-family: "Unbounded", sans-serif; font-weight: 800;
      font-size: 98px; line-height: .84; letter-spacing: -.055em; text-transform: uppercase;
    }
    h1 .outline { display: block; color: transparent; -webkit-text-stroke: 1.5px rgba(238,242,246,.6); margin-left: 6px; }
    p { margin-top: 22px; max-width: 590px; color: #aab6c4; font-size: 19px; line-height: 1.5; }
    .bottom {
      margin-top: auto; display: flex; align-items: center; justify-content: space-between;
      padding-top: 20px; border-top: 1px solid rgba(255,255,255,.12);
      font-family: Consolas, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    }
    .tags { display: flex; gap: 10px; color: #8f9baa; }
    .tags b { color: #ff9e2c; font-weight: 400; }
    .ip { color: #e8eef6; }
    .corner { position: absolute; width: 26px; height: 26px; border-color: #ff9e2c; border-style: solid; z-index: 3; }
    .corner.tl { top: 22px; left: 22px; border-width: 2px 0 0 2px; }
    .corner.br { right: 22px; bottom: 22px; border-width: 0 2px 2px 0; }
  </style>
</head>
<body>
  <img class="bg" src="../assets/hero-mirage.svg" alt="">
  <div class="shade"></div>
  <div class="grid"></div>
  <div class="corner tl"></div>
  <div class="corner br"></div>

  <div class="content">
    <div class="brand">
      <img src="../assets/logo.svg" alt="">
      <div class="brand-name">Fexing<span>Project</span></div>
    </div>

    <div class="kicker">Counter-Strike 2 · Mirage · 5×5</div>
    <h1>Fexing<span class="outline">Project</span></h1>
    <p>Одна карта. Десять слотов. Бесконечные раунды. Без pay-to-win.</p>

    <div class="bottom">
      <div class="tags"><b>■</b> MIRAGE <b>■</b> 5×5 <b>■</b> INFINITE ROUNDS</div>
      <div class="ip">fexingproject.ru:27015</div>
    </div>
  </div>
</body>
</html>
