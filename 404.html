<!doctype html>
<html lang="ru">
<head>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">

<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  <header class="site-header is-scrolled">
    <div class="container header-inner">

      <div class="header-tools">
        <button class="ip-chip" type="button" data-copy-connect aria-label="Скопировать IP сервера">

    </div>

      <div class="cta-actions">
        <a class="btn btn-primary" href="index.html">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg>
          На главную
        </a>
        <button class="btn btn-ghost" type="button" data-copy-connect>
